# -----------------------------------------------------------
# decluttering.yaml
# Decluttering-card templates — reusable parameterized cards
# (light_row_v2 button-card grid, scene_button toggle).
# Author: Graham Stott (littlestotty-labs)
# Version: 2.0
# -----------------------------------------------------------

light_row_v2:
  card:
    type: custom:button-card
    entity: "[[entity]]"
    show_name: false
    show_icon: false
    show_label: false
    display: grid
    show_state: false
    styles:
      grid:
        - grid-template-areas: |
            "power lock slider motion"
        - grid-template-columns: 13% 13% 67% 10%
        - grid-template-rows: 1fr
      card:
        - border-radius: var(--ha-card-border-radius)
        - padding-left: 12px
        - padding-right: 20px
        - padding-top: 0px
        - padding-bottom: 0px
        - height: 55px
      custom_fields:
        motion:
          - justify-self: end
    custom_fields:
      power:
        card:
          type: custom:button-card
          show_name: false
          show_label: false
          show_state: false
          icon: mdi:power
          entity: "[[entity]]"
          styles:
            card:
              - width: 40px
              - height: 35px
              - border-radius: 30%
            icon:
              - width: 30px

      lock:
        card:
          type: custom:button-card
          show_name: false
          show_label: false
          show_state: false
          icon: mdi:lock-open-outline
          entity: "[[lock_entity]]"
          state:
            - value: "on"
              icon: mdi:lock-outline
              styles:
                icon:
                  - color: lightgreen
          styles:
            card:
              - width: 40px
              - height: 35px
              - border-radius: 30%
            icon:
              - width: 30px
      slider:
        card:
          type: custom:bubble-card
          card_type: button
          button_type: slider
          entity: "[[entity]]"
          min_value: 0
          max_value: 100
          relative_slide: false
          slider_live_update: true
          allow_light_slider_to_0: true
          light_transition: false
          button_action:
            tap_action:
              action: more-info
          show_icon: false
          show_name: true
          name: "[[name]]"
          scrolling_effect: false
          show_attribute: false
          attribute: brightness
          styles: |
            .bubble-container {
              text-align: start;
              height: 35px !important;
              background: var(--bubble-slider-background) !important;
              opacity: 1 !important;
              border-radius: 35px !important;
              box-shadow: inset 0 1px 2px rgba(0,0,0,0.15) !important;
            }
            * {
              --bubble-button-border-radius: 12px;
            }
      motion: |
        [[[
          var m = '[[motion_entity]]';
          if (!m) return '';
          var s = states[m];
          if (!s) return '';
          var on = s.state === 'on';
          return '<ha-icon icon="mdi:motion-sensor" style="--mdc-icon-size:22px;color:' + (on?'red':'var(--secondary-text-color)') + ';opacity:' + (on?'1':'0.35') + ';"></ha-icon>';
        ]]]

weather_chip:
  card:
    type: custom:button-card
    name: |
      [[[ [[name_template]] ]]]
    entity: "[[entity]]"
    icon: "[[icon]]"
    show_state: false
    show_name: true
    show_icon: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content min-content
      card:
        - justify-self: center
        - justify-content: center
        - align-self: start
        - border-radius: 50px
        - width: auto
        - height: 35px
        - padding-right: 8px
      name:
        - justify-self: center
        - font-size: 12px
        - font-weight: 600
        - color: var(--primary-text-color)
      img_cell:
        - width: 30px
        - background: transparent
        - border-radius: 100%
        - justify-content: center
        - padding-left: 2px
      icon:
        - width: 20px
        - padding-left: 2px
        - color: "[[icon_color]]"

scene_button:
  card:
    type: custom:button-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    styles:
      card:
        - margin-top: "-12px"
        - margin-bottom: "-12px"
        - margin-left: "-7px"
        - border-radius: var(--ha-card-border-radius)
      icon:
        - width: 80%
        - height: 80%
        - color: var(--primary-color)
      img_cell:
        - border-radius: 50%
        - width: 80%
        - height: 80%
      name:
        - font-size: 12px
        - font-weight: 500
        - color: var(--primary-color)
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--scene-selected-color)
          card:
            - background-color: var(--scene-active-background)
          name:
            - color: var(--scene-selected-color)

storage_separator:
  card:
    type: custom:bubble-card
    card_type: separator
    name: "[[name]]"
    rows: 1
    styles: >-
      ha-card {
        margin-top: [[margin_top]];
        margin-left: -14px;
        margin-bottom: -10px !important;
      }

      .bubble-sub-button-1 { color:
      var(--popup-secondary-text);;
      background:
      var(--popup-card-background);
      }

      .separator-container {color: var(--room-tech);}

      .bubble-line { background: transparent; height: 2px }

      .bubble-name {
        color:  var(--popup-secondary-text) !important;
        font-size:12px !important;
      }

storage_bar:
  card:
    type: custom:button-card
    show_icon: false
    name: "[[name]]"
    entity: "[[entity]]"
    custom_fields:
      bar: |
        [[[
          var state = states['[[bar_entity]]'].state;
          var color = "#7fa36a";
          if (state >=85 )      color = "#c74b4b";
          else if (state >=70 ) color = "#d17a4a";
          else if (state >=60) color = "#d1b04a";
          else if (state >=50) color = "#a8b85a";
          return `
          <div>
          <div style="border-radius: 10px;background: ${color}; height: 12px; width: ${state}%; box-shadow: inset 1px 1px 1px 0px rgba(255,255,255,.3);">
          </div>
          </div>
          `
        ]]]
      stat1: |
        [[[ [[stat1]] ]]]
      stat2: |
        [[[ [[stat2]] ]]]
      stat3: |
        [[[ [[stat3]] ]]]
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border-radius: 0px
        - border: none
        - padding: 0px 15px 0px 2px
        - margin-left: 1px
        - margin-top: 0px
        - margin-bottom: -5px
      custom_fields:
        bar:
          - overflow: hidden
          - box-shadow: inset -3px -1px 2px 0px rgba(255,255,255,.1)
          - background: var(--battery_slider_background)
          - justify-self: start
          - width: 100%
          - height: 12px
          - border-radius: 10px
        stat1:
          - justify-self: start
          - font-size: 10px
          - opacity: 0.7
        stat2:
          - justify-self: center
          - font-size: 10px
          - opacity: 0.7
        stat3:
          - justify-self: end
          - font-size: 10px
          - opacity: 0.7
          - padding-right: 2px
      grid:
        - grid-template-areas: '"n bar bar bar" ". stat1 stat2 stat3"'
        - grid-template-columns: 0.6fr 1fr 1fr 1fr
      name:
        - justify-self: start
        - font-size: 11px
        - opacity: 0.9
        - padding-left: 0px
