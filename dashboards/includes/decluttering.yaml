# -----------------------------------------------------------
# decluttering.yaml
# Decluttering-card templates — reusable parameterized cards
# (light_row slider with lock, scene_button toggle).
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

light_row:
  card:
    type: custom:bubble-card
    card_type: button
    button_type: slider
    sub_button:
      main:
        - entity: "[[entity]]"
          name: percent
          scrolling_effect: false
          show_background: false
          light_background: false
          show_icon: false
          show_state: false
          show_attribute: true
          attribute: brightness
        - entity: "[[lock_entity]]"
          scrolling_effect: false
          show_icon: true
          show_background: true
          state_background: true
          use_accent_color: true
          show_state: false
          tap_action:
            action: toggle
          hide_when_parent_unavailable: true
          content_layout: icon-left
          name: lock
      bottom: []
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    scrolling_effect: false
    use_accent_color: false
    show_state: false
    show_attribute: false
    attribute: brightness
    min_value: 0
    max_value: 100
    step: 1
    slider_live_update: true
    allow_light_slider_to_0: true
    light_transition: true
    tap_action:
      action: none
    hold_action:
      action: more-info
    styles: |-
      .bubble-container {
        height: 50px !important;
        background-color: var(--card-background-color) !important;
        opacity: 1 !important;
        border-radius: var(--ha-card-border-radius) !important;
        box-shadow: var(--ha-card-box-shadow) !important;
      }
      * {
        --bubble-button-border-radius: 12px;
      }
      .bubble-range-fill {
        opacity: var(--bubble-light-opacity) !important;
        background-color: var(--accent-color) !important;
        right: 100 !important;
        left: 10 !important;
        transform-origin: left center !important;
      }
      ${
        (() => {
          const sub = card.querySelector('.lock');
          if (!sub) return;
          const entity = sub.getAttribute('data-entity');
          const state = hass.states[entity]?.state;
          sub.style.backgroundColor = state === 'on' ? 'green' : '';
        })()
      }

      ${
        (() => {
          const lock = card.querySelector('.lock');
          const fill = card.querySelector('.bubble-range-fill');
          if (!lock || !fill) return;

          const entity = lock.getAttribute('data-entity');
          const locked = hass.states[entity]?.state === 'on';

          fill.style.filter = locked ? 'saturate(0.3)' : '';
          fill.style.boxShadow = locked
                ? 'inset 0 0 0px 1px rgba(0, 150, 0, 0.4)'
                : '';
        })()
      }       

      ${
        (() => {
          const lock = card.querySelector('.lock');
          if (!lock) return;

          const entity = lock.getAttribute('data-entity');
          const locked = hass.states[entity]?.state === 'on';

          lock.style.opacity = locked ? '1' : '0.6';
          lock.style.transform = locked ? 'scale(1)' : 'scale(0.85)';
        })()
      }
weather_chip:
  card:
    type: custom:button-card
    name: |
      [[[ [[name_template]] ]]]
    entity: "[[entity]]"
    icon: "[[icon]]"
    show_state: false
    show_name: true
    show_icon: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content min-content
      card:
        - justify-self: center
        - justify-content: center
        - align-self: start
        - border-radius: 50px
        - width: auto
        - height: 35px
        - padding-right: 8px
      name:
        - justify-self: center
        - font-size: 12px
        - font-weight: 600
        - color: var(--primary-text-color)
      img_cell:
        - width: 30px
        - background: transparent
        - border-radius: 100%
        - justify-content: center
        - padding-left: 2px
      icon:
        - width: 20px
        - padding-left: 2px
        - color: "[[icon_color]]"

scene_button:
  card:
    type: custom:button-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    styles:
      card:
        - margin-top: "-12px"
        - margin-bottom: "-12px"
        - margin-left: "-7px"
        - border-radius: var(--ha-card-border-radius)
      icon:
        - width: 80%
        - height: 80%
        - color: var(--primary-color)
      img_cell:
        - border-radius: 50%
        - width: 80%
        - height: 80%
      name:
        - font-size: 12px
        - font-weight: 500
        - color: var(--primary-color)
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--scene-selected-color)
          card:
            - background-color: var(--scene-active-background)
          name:
            - color: var(--scene-selected-color)

storage_separator:
  card:
    type: custom:bubble-card
    card_type: separator
    name: "[[name]]"
    rows: 1
    styles: >-
      ha-card {
        margin-top: [[margin_top]];
        margin-left: -14px;
        margin-bottom: -20px !important;
      }

      .bubble-sub-button-1 { color:
      var(--popup-secondary-text);;
      background:
      var(--popup-card-background);
      }

      .separator-container {color: var(--room-tech);}

      .bubble-line { background: transparent; height: 2px }

      .bubble-name {
        color:  var(--popup-secondary-text) !important;
        font-size:12px !important;
      }

storage_bar:
  card:
    type: custom:button-card
    show_icon: false
    name: "[[name]]"
    entity: "[[entity]]"
    custom_fields:
      bar: |
        [[[
          var state = states['[[entity]]'].state;
          var color = "#a36a80ff";
          if (state >=85 )      color = "#a36a80ff";
          else if (state >=70 ) color = "#a36a80ff";
          else if (state >=60) color = "#a36a80ff";
          else if (state >=50) color = "#a36a80ff";
          return `
          <div>
          <div style="border-radius: 10px;background: ${color}; height: 15px; width: ${state}%; box-shadow: inset 1px 1px 1px 0px rgba(255,255,255,.3);">
          </div>
          </div>
          `
        ]]]
      stat1: |
        [[[ [[stat1]] ]]]
      stat2: |
        [[[ [[stat2]] ]]]
      stat3: |
        [[[ [[stat3]] ]]]
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 0px 15px 0px 2px
        - margin-left: 1px
        - margin-top: 0px
        - margin-bottom: -5px
      custom_fields:
        bar:
          - overflow: hidden
          - box-shadow: inset -3px -1px 2px 0px rgba(255,255,255,.1)
          - background: var(--battery_slider_background)
          - justify-self: start
          - width: 100%
          - height: 15px
          - border-radius: 10px
        stat1:
          - justify-self: start
          - font-size: 10px
          - opacity: 0.7
        stat2:
          - justify-self: center
          - font-size: 10px
          - opacity: 0.7
        stat3:
          - justify-self: end
          - font-size: 10px
          - opacity: 0.7
          - padding-right: 2px
      grid:
        - grid-template-areas: '"n bar bar bar" ". stat1 stat2 stat3"'
        - grid-template-columns: 0.6fr 1fr 1fr 1fr
      name:
        - justify-self: start
        - font-size: 11px
        - opacity: 0.9
        - padding-left: 0px
