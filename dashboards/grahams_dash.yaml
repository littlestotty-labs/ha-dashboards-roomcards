# -----------------------------------------------------------
# ui-lovelace.yaml
# Main dashboard — single-page room-centric layout with
# Bubble Card pop-ups (inline), room grid, and scene bar.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

kiosk_mode: !include includes/kiosk.yaml

decluttering_templates: !include includes/decluttering.yaml

button_card_templates: !include_dir_merge_named button_templates/

title: MyDashboard
views:
  - title: Home
    path: home
    cards:
      - !include home_cards_flat/scenes.yaml
      - type: vertical-stack
        cards:
          - square: false
            type: grid
            cards:
              - !include home_cards_flat/lounge.yaml
              - !include home_cards_flat/bedroom.yaml
              - !include home_cards_flat/office.yaml
              - !include home_cards_flat/lights.yaml
              - !include home_cards_flat/garden.yaml

              - type: vertical-stack
                cards:
                  - !include home_cards_flat/kitchen.yaml
                  - !include home_cards_flat/tech.yaml
            columns: 1
      - !include home_cards_flat/petrol.yaml
      - !include popup_cards/lounge.yaml
      - !include popup_cards/bedroom.yaml
      - !include popup_cards/office.yaml
      - !include popup_cards/lights.yaml
      - !include popup_cards/weather.yaml
      - !include popup_cards/petrol.yaml
      - !include popup_cards/garden.yaml
      - !include popup_cards/tech.yaml

      - !include popup_cards/kitchen.yaml
      - !include home_cards_flat/banner.yaml
    background:
      opacity: 33
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
