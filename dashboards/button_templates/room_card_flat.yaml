# -----------------------------------------------------------
# room_card.yaml
# Base button-card template for room tiles — 140px card with
# name, label, accent-colored icon circle, and btn slot.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

room_card_flat:
  variables:
    show_state: false
    show_label: false
    accent_color: blue
  name: "[[[ return variables.name]]]"
  icon: "[[[ return variables.icon]]]"
  label: "[[[ return variables.label]]]"
  tap_action:
    action: navigate
  styles:
    grid:
      - grid-template-areas: |
          '"n l" " btn" " btn" " btn" " btn"'
      - grid-template-columns: 20% 20% 20% 20% 20%
      - grid-template-rows: auto auto
    card:
      - height: 65px
      - padding: 10px 10px 15px 15px
    custom_fields:
      btn:
        - justify-content: end
        - align-self: start
    name:
      - justify-self: start
      - align-self: start
      - font-size: 16px
      - font-weight: 800
      - color: "[[[return variables.accent_color]]]"
    label:
      - min-height: 80px
      - text-align: left
      - justify-content: start
      - justify-self: start
      - align-self: start
      - font-size: 12px
      - font-weight: 800
      - color: "[[[return variables.accent_color]]]"
      - opacity: 0.7
      - word-break: break-word
      - white-space: normal
    img_cell:
      - justify-content: start
      - position: absolute
      - width: 105px
      - height: 105px
      - left: 0
      - bottom: 0
      - margin: 0 0 -20px -20px
      - background: >
          [[[ return "color-mix(in srgb, " + variables.accent_color + ",
          transparent 60%)"; ]]]
      - border-radius: 500px
    icon:
      - margin-left: 25px
      - width: 50px
      - color: >
          [[[ return "color-mix(in srgb, " + variables.accent_color + ", black
          70%)"; ]]]
      - opacity: "0.3"
  show_state: true
