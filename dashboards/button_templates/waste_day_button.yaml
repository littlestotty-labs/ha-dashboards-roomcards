# -----------------------------------------------------------
# waste_day_button.yaml
# Composed template — room_button + fan mixin for room card
# fan toggle buttons.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

waste_day_button:
  template:
    - room_button
  styles:
    img_cell:
      - padding: -5px
    entity_picture:
      - padding: 0px
      - size: 200%
    card:
      - background-image: |
          [[[ 
            var images = states["sensor.next_bins_type"].state; 
            return 'url(/local/icons/wastebins/'+images+'.png)'
          ]]]
      - background-repeat: no-repeat
      - background-size: 90%
      - background-position-x: 3px
      - background-position-y: center
      - background-origin: border-box
  show_entity_picture: true
  show_icon: false
