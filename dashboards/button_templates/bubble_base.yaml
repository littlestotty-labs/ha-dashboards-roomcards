# -----------------------------------------------------------
# bubble_base.yaml
# Base button-card template for Bubble Card pop-up toggles —
# theme-aware on/off styling with accent color states.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

bubble_base:
  variables:
    show_state: true
    name: ""
    attribute_entity: ""
    colour: "white"
    
  name: "[[[ return variables.name ]]]"
  show_state: "[[[ return variables.show_state ]]]"
  tap_action:
    action: toggle
  entity: "[[[ return variables.entity]]]"
  icon: "[[[ return variables.icon]]]"
  state_display: |
    [[[
      if (entity.state === 'unavailable' || entity.state === 'unknown') return 'Offline';

      // 1. If main entity is missing or turned off, immediately return 'Off'
      if (!entity || entity.state == 'off') return 'Off';
      
      const attrEnt = variables.attribute_entity;
      
      // 2. If attribute_entity exists and is registered in HA
      if (attrEnt && hass.states[attrEnt]) {
        const attrState = hass.states[attrEnt].state;
        
        // If the sensor itself is turned off, just show 'On'
        if (attrState === 'off') return 'On';
        
        // If the sensor is on (for binary sensors) or has a value, show it
        if (attrState === 'on') return 'On';
        
        // Fetch the unit of measurement attribute dynamically, fallback to empty string if missing
        const unit = hass.states[attrEnt].attributes.unit_of_measurement || '';
        
        // Return the sensor value with its native unit (trimmed to clean up extra spaces)
        return 'On (' + `${attrState} ${unit}`.trim() + ')';
      }
      
      // 3. Fallback: If attribute_entity is missing, use the main entity's state text
      if (entity.state === 'on') {return 'On';}
      return entity.state;
    ]]]
  state:
    - value: "unavailable"
      id: state_unavailable
      styles:
        card:
          - opacity: 0.5
        icon:
          - color: grey
        name:
          - color: grey
    - operator: template
      value: "[[[ return entity && ['off', 'Weekend','City Based' ].includes(entity.state); ]]]"
      id: state_off
      styles:
        img_cell:
          - background: var(--bubble-icon-background-color)
        card:
          - background: var(--card-background-color)
        icon:
          - color: var(--bubble-icon-color-off)
        name:
          - color: var(--bubble-switch-text-off)
        state:
          - color: var(--bubble-switch-status-off)
    - operator: template
      value: "[[[ return entity && ['on', 'Home Based'].includes(entity.state); ]]]"
      id: state_on
      styles:
        card:
          - background: var(--bubble-icon-color-on)
          # - box-shadow: var(--ha-card-box-shadow-on)
        img_cell:
          - box-shadow: >-
              inset 0px 3px 3px rgba(147, 147, 147, 0.88), inset 0px 1px 3px
              rgba(207, 207, 207, 0.2)
          - background: var(--bubble-icon-background-color-on)
        icon:
          - color: var(--bubble-icon-color-on)
        name:
          - color: var(--bubble-switch-text-on)
        state:
          - color: var(--bubble-switch-status-on)

  styles:
    card:
      - padding: 5px 0px 5px 6px
      - height: 50px
      - border-radius: var(--ha-card-border-radius)
    grid:
      - grid-template-areas: |
          "i n"
          "i s"
        # 1. Enforce strict ratios by telling the grid tracks they are allowed to shrink to 0
      - grid-template-columns: minmax(0, 3.3fr) minmax(0, 6.7fr)
      - grid-template-rows: 50% 50%
    img_cell:
      - justify-self: start
      - align-self: center
      - padding: 0px
      - border-radius: 50%       # 1. 50% creates a perfect circle (500% stretches it)
      - width: 40px              # 2. Hard-code a size or use a percentage
      - aspect-ratio: 1 / 1      # 3. Forces height to always match the width perfectly
      - background-color: var(--secondary-background-color) # (Optional) Helps you see the circle

    icon:
      - align-self: center
      - width: 70%
      - height: 70%
      - color: rgba(100,100,100,.7)
    name:
      - justify-self: start
      - text-align: left
      - font-size: 13px
      - font-weight: 600
      - padding-top: 5px
      - color: rgba(100,100,100,.7)
      - min-width: 0
      - text-overflow: ellipsis
      - overflow: hidden
      - white-space: nowrap
    state:
      - justify-self: start
      - text-align: left
      - font-size: 12px
      - font-weight: 450
      - padding-bottom: 1px
      - color: rgba(100,100,100,.7)
      - min-width: 0
      - text-overflow: ellipsis
      - overflow: hidden
      - white-space: nowrap
      