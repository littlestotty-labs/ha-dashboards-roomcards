# -----------------------------------------------------------
# popup_cards/tech.yaml
# Standalone bubble-card pop-up for the Tech Stuff room.
# Extracted from ui-lovelace.yaml during v3.2.0 migration.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

type: custom:bubble-card
card_type: pop-up
name: Tech Stuff
icon: mdi:devices
hash: "#room_tech"
is_sidebar_hidden: true
margin_top_mobile: "-30px"
margin_top_desktop: "-30px"
button_type: name
show_header: true
styles: |
  .bubble-pop-up-background {
    background: var(--popup-header-background) !important;
  }
  .bubble-button-background {
    background: var(--popup-header-background) !important; 
  } 
  .bubble-close-icon {
    --mdc-icon-size: 40px !important;
      color: var(--room-tech);
  }       
  .bubble-header {
      color: var(--room-tech) !important;
  }
sub_button:
  main: []
  bottom: []
slider_fill_orientation: left
slider_value_position: right
cards:
  - type: custom:gap-card
    height: 40px
  - type: custom:stack-in-card
    mode: vertical
    cards:
      - type: markdown
        content: |
          # Low Batteries
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }

            ha-markdown {
              font-size: 9px;
              font-weight: 300;
              color: var(--room-tech);
              margin-top: 10px;
              margin-bottom: 0px;
              padding: 00px 0px 0px 20px !important;
            }
      - type: custom:auto-entities
        card:
          type: entities
          card_mod:
            style: |
              ha-card {
                background: transparent;
                box-shadow: none;
                border: none;
                padding: 0;
                margin-top: -20px;
              }
        filter:
          include:
            - options:
                type: custom:button-card
                entity: this.entity_id
                show_icon: false
                show_state: true
                custom_fields:
                  bar: |
                    [[[
                      const state = Number(entity.state);

                      let color = "#5f8f6a"; // high battery (default)

                      if (state <= 15)      color = "#c74b4b"; // red
                      else if (state <= 30) color = "#d17a4a"; // orange
                      else if (state <= 45) color = "#d1b04a"; // amber
                      else if (state <= 60) color = "#a8b85a"; // olive
                      else if (state <= 75) color = "#7fa36a"; // muted green

                      const width = isNaN(state) ? 0 : Math.min(Math.max(state, 0), 100);
                      
                      return `
                        <div class="battery-track">
                          <div
                            class="battery-fill"
                            style="width:${state}%; background:${color};"
                          ></div>
                        </div>
                      `;
                    ]]]
                styles:
                  grid:
                    - grid-template-areas: '"n s" "bar bar"'
                    - grid-template-columns: 1fr min-content
                    - grid-template-rows: min-content min-content 1fr
                    - grid-template-rows: min-content min-content
                  card:
                    - padding: 1px 1px 1px 1px
                    - border: none;
                    - box-shadow: none
                    - border-radius: 10px
                    - background: var(--card-background-color);
                  name:
                    - justify-self: start
                    - text-align: left
                    - font-size: 12px
                    - padding: 0px 4px 6px 0px
                    - color: var(--primary-color)
                  state:
                    - justify-self: start
                    - text-align: left
                    - font-size: 12px
                    - padding: 0px 4px 6px 0px
                    - color: var(--primary-color)
                    - opacity: 0.7
                  custom_fields:
                    bar:
                      - width: 100%
                      - height: 12px
                      - justify-self: stretch
                card_mod:
                  style: |
                    .battery-track {
                      width: 100%;
                      height: 12px;
                      background: var(--battery_slider_background);
                      border-radius: 50px;
                      overflow: hidden;
                      box-shadow: inset -3px -1px 2px 0px rgba(255,255,255,.1);                
                      }

                    .battery-fill {
                      height: 100%;
                      border-radius: 50px;
                      box-shadow: inset 1px 1px 1px 0px rgba(255,255,255,.5);
                    }
              entity_id: "*battery*"
          exclude:
            - options: {}
              state: "> 80"
            - options: {}
              state: "off"
            - options: {}
              state: unavailable
            - options: {}
              state: Unavailable
            - options: {}
              state: unknown
            - options: {}
              entity_id: "*state*"
            - options: {}
              entity_id: "*906*"
            - options: {}
              entity_id: "*926*"
        sort:
          method: state
          numeric: true
          reverse: false
          count: 55
  - type: custom:button-card
    name: Server Storage
    icon: mdi:server
    entity: sensor.infinity_volume_used_media_volume

    custom_fields:
      btn:
        card:
          type: vertical-stack
          cards:
            - type: custom:decluttering-card
              template: storage_separator
              variables:
                - name: QNAP
                - margin_top: "-5px"
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: App
                - entity: sensor.infinity_volume_used_appvolume
                - bar_entity: sensor.infinity_volume_used_appvolume
                - stat1: "const v = parseFloat(states['sensor.infinity_used_space_appvolume'].state); return v.toFixed(0) + ' GB Used';"
                - stat2: "const v = parseFloat(states['sensor.infinity_free_space_appvolume'].state); return v.toFixed(0) + ' GB Free';"
                - stat3: "return '411 GB Total';"
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: Media
                - entity: sensor.infinity_volume_used_media_volume
                - bar_entity: sensor.infinity_volume_used_media_volume
                - stat1: "const v = parseFloat(states['sensor.infinity_used_space_media_volume'].state); return v.toFixed(0) + ' GB Used';"
                - stat2: "const v = parseFloat(states['sensor.infinity_free_space_media_volume'].state); return v.toFixed(0) + ' GB Free';"
                - stat3: "return '7.3 TB Total';"
            - type: custom:decluttering-card
              template: storage_separator
              variables:
                - name: NVIDIA SHIELD
                - margin_top: "0px"
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: Internal
                - entity: sensor.system_monitor_disk_use_share_shield_internal
                - bar_entity: sensor.system_monitor_disk_usage_share_shield_internal
                - stat1: "const v = parseFloat(states['sensor.system_monitor_disk_use_share_shield_internal'].state); return v.toFixed(0) + ' GB Used';"
                - stat2: "const v = parseFloat(states['sensor.system_monitor_disk_free_share_shield_internal'].state); return v.toFixed(0) + ' GB Free';"
                - stat3: "return '11.6 GB Total';"
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: Media
                - entity: sensor.system_monitor_disk_use_share_shield_media
                - bar_entity: sensor.system_monitor_disk_usage_share_shield_media
                - stat1: "const v = parseFloat(states['sensor.system_monitor_disk_use_share_shield_media'].state); return v.toFixed(0) + ' GB Used';"
                - stat2: "const v = parseFloat(states['sensor.system_monitor_disk_free_share_shield_media'].state); return v.toFixed(0) + ' GB Free';"
                - stat3: "return '1.8 TB Total';"
            - type: custom:decluttering-card
              template: storage_separator
              variables:
                - name: SYNOLOGY
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: Vol 1
                - entity: sensor.synology_volume_1_volume_used
                - bar_entity: sensor.synology_volume_1_volume_used
                - stat1: "const tb = parseFloat(states['sensor.synology_volume_1_used_space'].state); return Math.round(tb * 1024) + ' GB Used';"
                - stat2: "const free = parseFloat(states['sensor.synology_volume_1_total_size'].state) - parseFloat(states['sensor.synology_volume_1_used_space'].state); return Math.round(free * 1024) + ' GB Free';"
                - stat3: "return '3.9 TB Total';"
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: Vol 2
                - entity: sensor.synology_volume_2_volume_used
                - bar_entity: sensor.synology_volume_2_volume_used
                - stat1: "const tb = parseFloat(states['sensor.synology_volume_2_used_space'].state); return Math.round(tb * 1024) + ' GB Used';"
                - stat2: "const free = parseFloat(states['sensor.synology_volume_2_total_size'].state) - parseFloat(states['sensor.synology_volume_2_used_space'].state); return Math.round(free * 1024) + ' GB Free';"
                - stat3: "return '3.9 TB Total';"
            - type: custom:decluttering-card
              template: storage_bar
              variables:
                - name: USB
                - entity: sensor.synology_usb_disk_2_partition_1_partition_used
                - bar_entity: sensor.synology_usb_disk_2_partition_1_partition_used
                - stat1: "const v = parseFloat(states['sensor.synology_usb_disk_2_partition_1_partition_used_space'].state); return v.toFixed(1) + ' GB Used';"
                - stat2: "const total = parseFloat(states['sensor.synology_usb_disk_2_partition_1_partition_size'].state); const used = parseFloat(states['sensor.synology_usb_disk_2_partition_1_partition_used_space'].state); return Math.round(total - used) + ' GB Free';"
                - stat3: "const total = parseFloat(states['sensor.synology_usb_disk_2_partition_1_partition_size'].state); return (total / 1024).toFixed(1) + ' TB Total';"
    styles:
      grid:
        - grid-template-areas: '"n l" "btn btn" "btn btn"'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: 2em 1fr
      card:
        - padding: 15px 15px 45px 15px
      custom_fields:
        btn:
          - justify-content: end
          - align-self: end
          - margin: 0 0 -27px 0
      name:
        - justify-self: start
        - align-self: start
        - font-size: 18px
        - font-weight: 600
        - color: var(--room-tech)
      label:
        - padding-right: 6px
        - text-align: right
        - justify-self: end
        - font-size: 19px
        - font-weight: 500
        - color: var(--room-tech)
        - opacity: 0.6
        - word-break: break-word
        - white-space: normal
    show_icon: false
    show_label: false

  - type: conditional
    conditions:
      - condition: and
        conditions:
          - condition: state
            entity: sensor.hp_color_laserjet_mfp_m277dw
            state_not: Unavailable
          - condition: state
            entity: sensor.hp_color_laserjet_mfp_m277dw
            state_not: unavailable
    card:
      type: custom:stack-in-card
      mode: vertical
      cards:
        - type: markdown
          content: |
            # Printers
          card_mod:
            style: |
              ha-card {
                border: none !important;
                box-shadow: none !important;
              }

              ha-markdown {
                font-size: 9px;
                font-weight: 500;
                color: var(--room-tech);
                margin-top: 5px;
                padding: 10px 0px 0px 15px !important;
              }
        - type: custom:button-card
          entity: sensor.hp_color_laserjet_mfp_m277dw
          name: null
          show_state: false
          show_icon: true
          icon: mdi:printer
          show_name: false
          styles:
            card:
              - background: var(--popup-card-background)
              - border-style: none
              - box-shadow: none
              - padding: 20px

            grid:
              - grid-template-areas: '" i c m y k" "n s s s s"'
              - grid-template-columns: 1fr 1fr 1fr 1fr 1fr
              - grid-template-rows: auto
            custom_fields:
              k:
                - width: 80%
                - margin: auto
              c:
                - width: 80%
                - margin: auto
              m:
                - width: 80%
                - margin: auto
              "y":
                - width: 80%
                - margin: auto
          custom_fields:
            k:
              card:
                type: custom:button-card
                show_name: false
                show_state: true
                entity: sensor.hp_color_laserjet_mfp_m277dw_black_cartridge_hp_cf400a
                extra_styles: |
                  [[[ return `
                    @keyframes pulse {
                      0% {
                        background-color: black;
                      }
                      50% {
                        background-color: transparent;
                      }
                      100% {
                        background-color: black;
                      }
                    }
                  `]]]
                styles:
                  icon:
                    - opacity: 0.7
                    - color: black
                  state:
                    - font-size: 0.7em
                    - font-weight: normal
                    - color: |
                        [[[
                        var color = 'black';
                        if (color == 'black') return 'magenta';
                        if (color == 'yellow') return 'black';
                        else return 'var(--grey800)';
                        ]]]
                  card:
                    - border: solid 1px VAR(--grey600)
                    - border-radius: 6px 6px 15px 15px
                    - background: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_black_cartridge_hp_cf400a"].state
                          var color = 'black';
                          var ink_color = 'black'; // Added quotes and fixed semicolon

                          if (color == 'magenta') ink_color = 'rgba(255,0,255,0.7)'; // Added quotes
                          if (color == 'cyan') ink_color = 'rgba(0,255,255,0.7)'; // Fixed rbga typo
                          if (color == 'yellow') ink_color = 'rgba(255,255,0,0.7)'; // Fixed rbga typo
                          if (color == 'black') ink_color = 'rgba(0,0,0,0.7)'; // Fixed rbga typo

                          return `linear-gradient(to top, ${ink_color}, ${ink_color} ${level}%, rgba(255,255,255,0.12) ${level}%)`;
                        ]]]
                    - animation: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_black_cartridge_hp_cf400a"].state
                          return (0 + level) < 10
                            ? 'pulse 3s ease-in-out infinite'
                            : 'none'
                        ]]]
            c:
              card:
                type: custom:button-card
                show_name: false
                show_state: true
                entity: sensor.hp_color_laserjet_mfp_m277dw_cyan_cartridge_hp_cf401a
                extra_styles: |
                  [[[ return `
                    @keyframes pulse {
                      0% {
                        background-color:cyan;
                      }
                      50% {
                        background-color: transparent;
                      }
                      100% {
                        background-color: cyan;
                      }
                    }
                  `]]]
                styles:
                  icon:
                    - opacity: 0.7
                    - color: cyan
                  state:
                    - font-size: 0.7em
                    - font-weight: normal
                    - color: |
                        [[[
                        var color = 'cyan';
                        if (color == 'black') return 'white';
                        if (color == 'yellow') return 'black';
                        else return 'var(--grey800)';
                        ]]]
                  card:
                    - border: solid 1px VAR(--grey600)
                    - border-radius: 6px 6px 15px 15px
                    - background: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_cyan_cartridge_hp_cf401a"].state
                          var color = 'cyan';
                          var ink_color = 'black'; // Added quotes and fixed semicolon

                          if (color == 'magenta') ink_color = 'rgba(255,0,255,0.7)'; // Added quotes
                          if (color == 'cyan') ink_color = 'rgba(0,255,255,0.7)'; // Fixed rbga typo
                          if (color == 'yellow') ink_color = 'rgba(255,255,0,0.7)'; // Fixed rbga typo
                          if (color == 'black') ink_color = 'rgba(0,0,0,0.7)'; // Fixed rbga typo

                          return `linear-gradient(to top, ${ink_color}, ${ink_color} ${level}%, rgba(255,255,255,0.12) ${level}%)`;
                        ]]]
                    - animation: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_cyan_cartridge_hp_cf401a"].state
                          return (0 + level) < 10
                            ? 'pulse 3s ease-in-out infinite'
                            : 'none'
                        ]]]
            m:
              card:
                type: custom:button-card
                entity: sensor.hp_color_laserjet_mfp_m277dw_magenta_cartridge_hp_cf403a
                show_name: false
                show_state: true
                extra_styles: |
                  [[[ return `
                    @keyframes pulse {
                      0% {
                        background-color:magenta;
                      }
                      50% {
                        background-color: transparent;
                      }
                      100% {
                        background-color: magenta;
                      }
                    }
                  `]]]
                styles:
                  icon:
                    - opacity: 0.7
                    - color: magenta
                  state:
                    - font-size: 0.7em
                    - font-weight: normal
                    - color: |
                        [[[
                        var color = 'magenta';
                        if (color == 'black') return 'white';
                        if (color == 'yellow') return 'black';
                        else return 'var(--grey800)';
                        ]]]
                  card:
                    - border: solid 1px VAR(--grey600)
                    - border-radius: 6px 6px 15px 15px
                    - background: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_magenta_cartridge_hp_cf403a"].state
                          var color = 'magenta';
                          var ink_color = 'black'; // Added quotes and fixed semicolon

                          if (color == 'magenta') ink_color = 'rgba(255,0,255,0.7)'; // Added quotes
                          if (color == 'cyan') ink_color = 'rgba(0,255,255,0.7)'; // Fixed rbga typo
                          if (color == 'yellow') ink_color = 'rgba(255,255,0,0.7)'; // Fixed rbga typo
                          if (color == 'black') ink_color = 'rgba(0,0,0,0.7)'; // Fixed rbga typo

                          return `linear-gradient(to top, ${ink_color}, ${ink_color} ${level}%, rgba(255,255,255,0.12) ${level}%)`;
                        ]]]
                    - animation: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_magenta_cartridge_hp_cf403a"].state
                          return (0 + level) < 10
                            ? 'pulse 3s ease-in-out infinite'
                            : 'none'
                        ]]]
            "y":
              card:
                type: custom:button-card
                show_name: false
                show_state: true
                entity: sensor.hp_color_laserjet_mfp_m277dw_yellow_cartridge_hp_cf402a
                extra_styles: |
                  [[[ return `
                    @keyframes pulse {
                      0% {
                        background-color:yellow;
                      }
                      50% {
                        background-color: transparent;
                      }
                      100% {
                        background-color: yellow;
                      }
                    }
                  `]]]
                styles:
                  icon:
                    - opacity: 0.7
                    - color: yellow
                  state:
                    - font-size: 0.7em
                    - font-weight: normal
                    - color: |
                        [[[
                        var color = 'yellow';
                        if (color == 'black') return 'white';
                        if (color == 'yellow') return 'black';
                        else return 'var(--grey800)';
                        ]]]
                  card:
                    - border: solid 1px VAR(--grey600)
                    - border-radius: 6px 6px 15px 15px
                    - background: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_yellow_cartridge_hp_cf402a"].state
                          var color = 'yellow';
                          var ink_color = 'black'; // Added quotes and fixed semicolon

                          if (color == 'magenta') ink_color = 'rgba(255,0,255,0.7)'; // Added quotes
                          if (color == 'cyan') ink_color = 'rgba(0,255,255,0.7)'; // Fixed rbga typo
                          if (color == 'yellow') ink_color = 'rgba(255,255,0,0.7)'; // Fixed rbga typo
                          if (color == 'black') ink_color = 'rgba(0,0,0,0.7)'; // Fixed rbga typo

                          return `linear-gradient(to top, ${ink_color}, ${ink_color} ${level}%, rgba(255,255,255,0.12) ${level}%)`;
                        ]]]
                    - animation: |
                        [[[
                          var level = states["sensor.hp_color_laserjet_mfp_m277dw_yellow_cartridge_hp_cf402a"].state
                          return (0 + level) < 10
                            ? 'pulse 3s ease-in-out infinite'
                            : 'none'
                        ]]]
