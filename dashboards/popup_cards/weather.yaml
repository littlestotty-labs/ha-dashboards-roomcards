# -----------------------------------------------------------
# popup_cards/weather.yaml
# Standalone bubble-card pop-up for Weather.
# Extracted from ui-lovelace.yaml during v3.2.0 migration.
# -----------------------------------------------------------

type: custom:bubble-card
card_type: pop-up
name: Weather
icon: mdi:sun
hash: "#weather"
is_sidebar_hidden: true
margin_top_mobile: "-30px"
margin_top_desktop: "-30px"
button_type: name
show_header: true
show_name: false
show_icon: false
styles: |
  .bubble-pop-up-background {
    background: var(--popup-header-background) !important;
  }
  .bubble-button-background {
    background: var(--popup-header-background) !important; 
  } 
  .bubble-close-icon {
    --mdc-icon-size: 40px !important;
      color: var(--room-lights);
  }       
  .bubble-header {
      color: var(--room-lights) !important;
  }
cards:
  - type: custom:gap-card
    height: 40px
  - type: custom:button-card
    entity: weather.ryde_weather
    show_state: true
    show_name: false
    show_icon: false
    show_label: true
    tap_action:
      action: more-info
    custom_fields:
      icon:
        card:
          type: custom:button-card
          show_name: false
          show_state: false
          show_entity_picture: true
          entity_picture: |
            [[[ 
              var images = states["weather.ryde"].state; 
              return '/local/ic/weather_icons/animated2/'+images+'.svg'
            ]]]
          styles:
            card:
              - margin: 0px
                padding: 0px
                box-shadow: 0 0 0 0;
                border: none
                background-color: var(--grey400)
                width: 170px
                height: 100px
                margin-right: "-30px"
                margin-top: 10px
            img_cell:
              - padding: 0px
                margin: 0px
                height: 100px
                width: 200px
                background-color: transparent;
    label: |
      [[[ 
        return 'Ryde <br/>' + states['sensor.ryde_temp'].state + '°';
      ]]]
    styles:
      grid:
        - grid-template-areas: '"l icon" "s icon"'
          grid-template-rows: auto auto
          justify-items: start
          align-items: start
      card:
        - padding: 0px
          margin: 0px
          background-color: transparent
          border-radius: 0px
          box-shadow: none
          border: none
      label:
        - font-size: 50px
          font-weight: 600
          color: var(--primary-color)
          justify-self: start
          align-self: start
          padding: 0px
          margin: 0px
      state:
        - font-size: 20px
          font-weight: 600
          color: var(--primary-color)
          justify-self: start
          align-self: start
          padding: 0px
          margin: 0px
      custom_fields:
        icon:
          - height: 60px;;
          - justify-self: end;
          - align-self: start;
          - padding-right: 17px
          - padding-top: 10px
  - type: markdown
    content: |-
      Feels like {{ states('sensor.ryde_temp_feels_like') }}°
      {{ states('sensor.ryde_extended_text_0') }}
    card_mod:
      style: |
        ha-card {
        border: none
        color: var(--grey300) !important;
        background-color: transparent;
        margin: 0px -15px 0px -15px;
        box-shadow: none;
        font-size: 16px;
        }
  - type: custom:button-card
    styles:
      grid:
        - grid-template-areas: '"chips" "chips"'
      card:
        - background: rgba(0, 0, 0, 0)
          box-shadow: none;
          flex-direction: row
          overflow-x: auto
          flex-wrap: nowrap
          flex-shrink: 0
          scrollbar-width: thin
          scrollbar-color: rgba(255,255,255, 0.05) rgba(255,255,255, 0)
          padding: 2
          margin-top: "-10px"
          border: none
    custom_fields:
      chips:
        card:
          type: horizontal-stack
          cards:
            - type: custom:decluttering-card
              template: weather_chip
              variables:
                - name_template: "return states['sensor.ryde_humidity'].state + '%';"
                - entity: sensor.ryde_humidity
                - icon: mdi:water
                - icon_color: var(--label-badge-green)
            - type: custom:decluttering-card
              template: weather_chip
              variables:
                - name_template: "return states['sensor.ryde_rain_since_9am'].state + 'mm';"
                - entity: sensor.ryde_rain_since_9am
                - icon: mdi:weather-rainy
                - icon_color: var(--label-badge-blue)
            - type: custom:decluttering-card
              template: weather_chip
              variables:
                - name_template: "var s = states['sensor.ryde_wind_speed_kilometre'].state + ' km/hr'; var d = states['sensor.ryde_wind_direction'].state; return s + ', ' + d;"
                - entity: sensor.ryde_wind_speed_kilometre
                - icon: mdi:weather-windy
                - icon_color: grey
            - type: custom:decluttering-card
              template: weather_chip
              variables:
                - name_template: "return states['sensor.ryde_max_temp'].state + '° High';"
                - entity: sensor.ryde_max_temp
                - icon: mdi:thermometer-chevron-up
                - icon_color: var(--label-badge-red)
            - type: custom:decluttering-card
              template: weather_chip
              variables:
                - name_template: "return states['sensor.ryde_min_temp'].state + '° Low';"
                - entity: sensor.ryde_min_temp
                - icon: mdi:thermometer-chevron-down
                - icon_color: var(--label-badge-blue)
  - type: custom:swipe-card
    card_width: 100%
    card_height: 110%
    start_card: 1
    parameters:
      grabCursor: true
      centeredSlides: false
      slidesPerView: 1.2
      spaceBetween: 15
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: sub_headings
            variables:
              var_name: |
                [[[ 
                  const currentHour = new Date().getHours();

                  if (currentHour < 12) {
                    return "Today";
                  } else if (currentHour < 18) {
                    return "Today";
                  } else {
                    return "This evening";
                  }
                ]]]
            styles:
              card:
                - border: none
                - box-shadow: none
                - background-colour: var(--gray600)
                - margin-top: 0px
          - type: custom:button-card
            entity: weather.ryde_hourly
            show_name: false
            show_icon: false
            show_label: false
            show_state: false
            tap_action:
              action: more-info
            styles:
              card:
                - padding: 20px
                - margin: 0px
              grid:
                - grid-template-areas: '"icon low high" "div div div" "desc desc desc"'
                - grid-template-columns: 35% auto auto
                - grid-template-rows: auto auto auto
              custom_fields:
                icon:
                  - align-self: start
                  - justify-self: start
                low:
                  - align-self: start
                  - justify-self: start
                  - margin-left: 5px
                high:
                  - align-self: start
                  - justify-self: start
                  - margin-left: 5px
                desc:
                  - align-self: start
                  - justify-self: start
                  - padding-top: 10px
            custom_fields:
              icon:
                card:
                  type: custom:button-card
                  entity: sensor.ryde_temp
                  entity_picture: |
                    [[[ 
                      var images = states["weather.ryde_hourly"].state; 
                      return '/local/ic/weather_icons/animated2/'+images+'.svg'
                    ]]]
                  show_entity_picture: true
                  tap_action:
                    action: more-info
                  show_state: false
                  show_name: false
                  show_icon: false
                  styles:
                    card:
                      - border: none
                      - padding: 0px
                      - padding-top: 5px
                      - margin: 0px
                      - box-shadow: none
                      - background-color: transparent
                    icon:
                      - width: 50px
              low:
                card:
                  type: custom:button-card
                  entity: weather.ryde_hourly
                  tap_action:
                    action: more-info
                  name: |
                    [[[ 
                      const now = new Date();
                      const currentHour = now.getHours();
                      let temp;

                      if (currentHour >= 18 || currentHour < 9) {
                        temp = states['sensor.ryde_now_temp_now'].state;
                      } else {
                        temp = states['sensor.ryde_now_temp_later'].state;
                      }

                      temp = temp.replace('°C', '').replace('C', '');
                      return temp + '°';
                    ]]]
                  label: |
                    [[[ 
                      const now = new Date();
                      const currentHour = now.getHours();
                      let label;

                      if (currentHour >= 18 || currentHour < 9) {
                        label = states['sensor.ryde_now_now_label'].state;
                      } else {
                        label = states['sensor.ryde_now_later_label'].state;
                      }

                      label = label.replace('Overnight', '').trim(); // Remove 'Overnight' and trim any extra spaces

                      return label;
                    ]]]
                  show_state: false
                  show_name: true
                  show_icon: false
                  show_label: true
                  styles:
                    card:
                      - box-shadow: none
                      - padding: 0px
                      - margin: 0px
                      - background-color: transparent
                      - border: none
                      - align-content: start
                      - justify-content: start
                      - border-radius: 0px
                    name:
                      - font-size: 30px
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
                      - padding-bottom: 5px
                    label:
                      - color: var(--primary-color)
                      - font-size: 12px
                      - text-transform: uppercase
                      - font-weight: 600
                      - justify-self: start
              high:
                card:
                  type: custom:button-card
                  entity: weather.ryde_hourly
                  tap_action:
                    action: more-info
                  name: |
                    [[[ 
                      const now = new Date();
                      const currentHour = now.getHours();
                      let temp;

                      if (currentHour >= 9 && currentHour < 18) {
                        temp = states['sensor.ryde_now_temp_now'].state;
                      } else {
                        temp = states['sensor.ryde_now_temp_later'].state;
                      }

                      temp = temp.replace('°C', '').replace('C', '');
                      return temp + '°';
                    ]]]
                  label: |
                    [[[ 
                      const now = new Date();
                      const currentHour = now.getHours();
                      let label;

                      if (currentHour >= 9 && currentHour < 18) {
                        label = states['sensor.ryde_now_now_label'].state;
                      } else {
                        label = states['sensor.ryde_now_later_label'].state;
                      }

                      label = label.replace('Overnight', '').trim(); // Remove 'Overnight' and trim any extra spaces

                      return label;
                    ]]]
                  show_state: false
                  show_name: true
                  show_icon: false
                  show_label: true
                  styles:
                    card:
                      - padding: 0px
                      - margin: 0px
                      - background-color: transparent
                      - align-content: start
                      - border: none
                      - justify-content: start
                      - border-radius: 0px
                      - box-shadow: none
                    name:
                      - font-size: 30px
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
                      - padding-bottom: 5px
                    label:
                      - font-size: 12px
                      - text-transform: uppercase
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
              desc:
                card:
                  type: custom:button-card
                  entity: weather.ryde_hourly
                  tap_action:
                    action: more-info
                  show_state: false
                  show_name: true
                  show_icon: false
                  show_label: true
                  name: |

                    [[[ 
                      return states['sensor.ryde_short_text_0'].state;
                    ]]]
                  label: |
                    [[[
                      const rainChance = parseInt(states['sensor.ryde_rain_chance_1'].state);
                      const rainAmountMax = states['sensor.ryde_rain_amount_max_1'].state;
                      if (rainChance <= 10) {
                        return 'Small chance of rain, 0-1mm';
                      } else {
                        return `${rainChance}% chance of rain, ${rainAmountMax}mm`;
                      }
                    ]]]
                  styles:
                    card:
                      - padding: 0px
                      - margin: 0px
                      - background-color: transparent
                      - box-shadow: none
                      - border-radius: 0px
                      - border: none
                    name:
                      - font-size: 16px
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
                    label:
                      - font-size: 14px
                      - padding-top: 5px
                      - font-weight: 500
                      - color: color(secondary-color)
                      - justify-self: start
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: sub_headings
            variables:
              var_name: Tomorrow
            styles:
              card:
                - margin-top: 0px
                - box-shadow: none
                - border: none
          - type: custom:button-card
            entity: weather.ryde_hourly
            show_name: false
            show_icon: false
            show_label: false
            show_state: false
            tap_action:
              action: more-info
            styles:
              card:
                - padding: 20px
                - margin: 0px
              grid:
                - grid-template-areas: '"icon low high" "div div div" "desc desc desc"'
                - grid-template-columns: 35% auto auto
                - grid-template-rows: auto auto auto
              custom_fields:
                icon:
                  - align-self: start
                  - justify-self: start
                low:
                  - align-self: start
                  - justify-self: start
                  - margin-left: 5px
                high:
                  - align-self: start
                  - justify-self: start
                  - margin-left: 5px
                desc:
                  - align-self: start
                  - justify-self: start
                  - padding-top: 10px
            custom_fields:
              icon:
                card:
                  type: custom:button-card
                  entity: sensor.ryde_temp
                  entity_picture: |
                    [[[ 
                      var images = states["weather.ryde"].state; 
                      return '/local/ic/weather_icons/animated2/'+images+'.svg'
                    ]]]
                  show_entity_picture: true
                  tap_action:
                    action: more-info
                  show_state: false
                  show_name: false
                  show_icon: false
                  styles:
                    card:
                      - padding: 0px
                      - padding-top: 5px
                      - margin: 0px
                      - box-shadow: none
                      - background-color: transparent
                      - border: none
                    icon:
                      - width: 50px
                      - border: none
              low:
                card:
                  type: custom:button-card
                  entity: weather.ryde_hourly
                  tap_action:
                    action: more-info
                  name: |
                    [[[ 
                      let temp = states['sensor.ryde_temp_min_1'].state;
                      temp = temp.replace('°C', '').replace('C', '');
                      return temp + '°';
                    ]]]
                  label: Low
                  show_state: false
                  show_name: true
                  show_icon: false
                  show_label: true
                  styles:
                    card:
                      - padding: 0px
                      - margin: 0px
                      - background-color: transparent
                      - box-shadow: none
                      - align-content: start
                      - justify-content: start
                      - border-radius: 0px
                      - border: none
                    name:
                      - font-size: 30px
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
                      - padding-bottom: 5px
                    label:
                      - font-size: 12px
                      - text-transform: uppercase
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
              high:
                card:
                  type: custom:button-card
                  entity: weather.ryde_hourly
                  tap_action:
                    action: more-info
                  name: |
                    [[[ 
                      let temp = states['sensor.ryde_temp_max_1'].state;
                      temp = temp.replace('°C', '').replace('C', '');
                      return temp + '°';
                    ]]]
                  label: High
                  show_state: false
                  show_name: true
                  show_icon: false
                  show_label: true
                  styles:
                    card:
                      - padding: 0px
                      - margin: 0px
                      - background-color: transparent
                      - align-content: start
                      - justify-content: start
                      - border-radius: 0px
                      - box-shadow: none
                      - border: none
                    name:
                      - font-size: 30px
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
                      - padding-bottom: 5px
                    label:
                      - font-size: 12px
                      - text-transform: uppercase
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
              desc:
                card:
                  type: custom:button-card
                  entity: weather.ryde_hourly
                  tap_action:
                    action: more-info
                  show_state: false
                  show_name: true
                  show_icon: false
                  show_label: true
                  name: |

                    [[[ 
                      return states['sensor.ryde_short_text_1'].state;
                    ]]]
                  label: |
                    [[[
                      const rainChance = parseInt(states['sensor.ryde_rain_chance_1'].state);
                      const rainAmountMax = states['sensor.ryde_rain_amount_max_1'].state;
                      if (rainChance <= 10) {
                        return 'Small chance of rain, 0-1mm';
                      } else {
                        return `${rainChance}% chance of rain, ${rainAmountMax}mm`;
                      }
                    ]]]
                  styles:
                    card:
                      - padding: 0px
                      - margin: 0px
                      - box-shadow: none
                      - background-color: transparent
                      - border-radius: 0px
                      - border: none
                    name:
                      - font-size: 16px
                      - font-weight: 600
                      - color: var(--primary-color)
                      - justify-self: start
                    label:
                      - font-size: 14px
                      - padding-top: 5px
                      - font-weight: 500
                      - color: var(--secondary-color)
                      - justify-self: start
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        styles:
          card:
            - background-color: blue
            - padding: 0px
            - margin: 0px
            - height: 0px
            - box-shadow: none
            - border: none
    card_mod:
      style: |
        ha_card {
          height: 110% !important;
          background: transparent !important;
        }
  - type: custom:button-card
    template: sub_headings
    variables:
      var_name: Hourly
    styles:
      card:
        - border: none
        - box-shadow: none;
        - margin-top: 0px
  - show_current: false
    show_forecast: true
    type: weather-forecast
    entity: weather.ryde_hourly
    forecast_type: hourly
    theme: ios
    card_mod:
      style: |
        ha-card {
        border: none
        box-shadow: none;
        background-color: transparent;
        margin: 0px 0px 0px 0px}
  - type: custom:button-card
    template: sub_headings
    variables:
      var_name: Forecast
    styles:
      card:
        - border: none
        - box-shadow: none
        - margin-top: 0px
  - type: custom:clock-weather-card
    entity: weather.ryde
    sun_entity: sun.sun
    temperature_sensor: sensor.outdoor_temp
    humidity_sensor: sensor.outdoor_humidity
    weather_icon_type: line
    animated_icon: true
    forecast_rows: 5
    locale: en-GB
    time_pattern: HH:mm
    time_format: 24
    date_pattern: ccc, d.MM.yy
    hide_today_section: true
    hide_forecast_section: false
    show_humidity: false
    hide_clock: false
    hide_date: false
    hourly_forecast: false
    use_browser_time: false
    time_zone: null
    show_decimal: false
    apparent_sensor: sensor.real_feel_temperature
    aqi_sensor: sensor.air_quality_index
    card_mod:
      style: |
        ha-card {
        box-shadow: none;
        background-color: transparent;
        margin: 0px 0px -15px 0px}
  - type: custom:button-card
    template: sub_headings
    variables:
      var_name: Recent
    styles:
      card:
        - border: none
        - box-shadow: none
        - margin-top: 0px
  - type: custom:mini-graph-card
    name: Ryde
    entities:
      - entity: sensor.ryde_temp_feels_like
        name: Feels Like
        color: lightgreen
      - entity: sensor.ryde_temp
        name: Actual
    color_thresholds:
      - value: 5
        color: white
      - value: 10
        color: "#68ce67"
      - value: 20
        color: "#3478f6"
      - value: 25
        color: "#a358d7"
      - value: 30
        color: "#eb4838"
      - value: 35
        color: "#f6ce46"
    show:
      icon: true
      name: true
      state: true
      fill: fade
    styles:
      card:
        border: none
    card_mod:
      style: |
        ha-card {
          -webkit-backdrop-filter: blur(10px); !important;
        }
  - type: custom:button-card
    template: sub_headings
    variables:
      var_name: Sun
    styles:
      card:
        - box-shadow: none
        - border: none
        - margin-top: 0px
  - type: custom:horizon-card
    moon: true
    refresh_period: 60
    fields:
      sunrise: true
      sunset: true
      dawn: true
      noon: true
      dusk: true
    southern_flip: false
    moon_phase_rotation: -10
    language: en
    time_format: language
    number_format: language
    card_mod:
      style: |
        ha-card {
          -webkit-backdrop-filter: blur(10px); !important;
        }
