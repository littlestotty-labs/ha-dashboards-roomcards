# -----------------------------------------------------------
# kitchen.yaml
# Room card — Kitchen half-height tile with dishwasher
# status button.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

type: custom:button-card
template: room_card
variables:
  accent_color: var(--room-kitchen)
name: Kitchen
icon: mdi:stove
show_label: true
label: |-
  [[[
    var power = states['switch.012030522493002223_bsh_common_setting_powerstate'].state;
    if (power == 'on') {
      var opState = states['sensor.012030522493002223_bsh_common_status_operationstate'].state;
      if (opState && opState.includes('Run')) {
        var prog = states['sensor.dishwasher_program_name'].state;
        var end = new Date(states['sensor.012030522493002223_bsh_common_option_remainingprogramtime'].state);
        if (prog == 'unavailable' || prog == 'unknown' || isNaN(end.getTime())) {
          return 'Dishwasher-Running';
        }
        var mins = Math.max(0, Math.round((end - new Date()) / 60000));
        var remain = mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + 'm';
        return prog + '<br>' + remain;
      }
      return 'Dishwasher-Idle';
    }
    return 'Dishwasher-Off';
  ]]]
tap_action:
  navigation_path: "#kitchen"
#styles:
#  card:
#    - height: 75px
custom_fields:
  btn:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: room_button
          entity: switch.012030522493002223_bsh_common_setting_powerstate
          icon: mdi:dishwasher
          variables:
            accent_color: var(--room-kitchen)
            tap_action: toggle

