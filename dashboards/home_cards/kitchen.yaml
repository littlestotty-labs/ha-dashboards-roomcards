# -----------------------------------------------------------
# kitchen.yaml
# Room card — Kitchen half-height tile with dishwasher
# status button.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

type: custom:button-card
template: room_card
variables:
  accent_color: var(--room-kitchen)
name: Kitchen
icon: null
show_label: true
label: dishwasher
tap_action:
  navigation_path: "#kitchen"
styles:
  card:
    - height: 75px
custom_fields:
  btn:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: room_button
          entity: switch.012030522493002223_bsh_common_setting_powerstate
          icon: mdi:dishwasher
          variables:
            accent_color: var(--room-kitchen)
