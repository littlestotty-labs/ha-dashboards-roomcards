# -----------------------------------------------------------
# bedroom.yaml
# Room card — Bedroom tile with temp/humidity label, fan,
# aircon, heater buttons, and vacuum alert overlay.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

type: custom:button-card
template: room_card
variables:
  accent_color: var(--room-bedroom)
name: |
  [[[
    const temp = parseFloat(states['sensor.temp_sensor_temperature'].state).toFixed(1);
    const hum = parseFloat(states['sensor.temp_sensor_humidity'].state).toFixed(1);
    const air = states['sensor.core_300s_pm2_5'].state;
    let emoji_air = '';
    
    if (air >=10) emoji_air = '🤢';
    else if (air<=2) emoji_air = '🌳';
    
    let emoji_temp = '';
    if (temp >= 27) emoji_temp = '🔥';
    else if (temp<17) emoji_temp = '❄️';
   let emoji_hum = '';
    if (hum >= 70 ) emoji_hum= '💧';
    return `<span style="display: inline-flex; align-items: center; font-size: 16px;">
      <span>Bedroom&nbsp;</span>
      <span style="font-size: 9px;">${emoji_temp}${emoji_hum}${emoji_air}</span>
    </span>`;
  ]]]
icon: mdi:bed
tap_action:
  navigation_path: "#room_bedroom"
show_label: true

label: |
  [[[
    const temp = parseFloat(states['sensor.temp_sensor_temperature'].state).toFixed(1);
    const hum = parseFloat(states['sensor.temp_sensor_humidity'].state).toFixed(1);
    let tempColor = 'inherit';
    if (temp >= 29) tempColor = 'red';
    else if (temp >= 27) tempColor = '#f58f01ff';
    else if (temp < 17) tempColor = '#25a6f1ff';

    let humColor = 'inherit';
    if (hum >= 70) humColor = 'red';
    return `<span style="color: ${tempColor}">${temp}°C </span> • <span style="color: ${humColor}">${hum}%</span>`;
  ]]]
custom_fields:
  vac:
    card:
      type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - condition: and
              conditions:
                - condition: state
                  entity: input_boolean.purifier_vacuum
                  state: "on"
          card:
            type: custom:button-card
            icon: mdi:vacuum
            entity: input_boolean.purifier_vacuum
            tap_action:
              action: navigate
              navigation_path: "#room_bedroom"
            styles:
              card:
                - animation: blink 2s ease infinite
                - height: 30px
                - width: 30px
                - border: none
                - box-shadow: none
                - border-style: none
                - border-radius: 100%
                - margin-right: 5px
                - margin-top: "-54px"
              img_cell:
                - border-radius: 100%
                - background: rgba(180,60,60,1)
              icon:
                - color: white
                - height: 18px
                - width: 18px
            show_name: false
  btn:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: fan_room_button
          icon: mdi:fan
          entity: switch.plug_blue
          variables:
            accent_color: var(--room-bedroom)
            tap_action: toggle
        - type: custom:button-card
          template: aircon_room_button
          entity: input_boolean.cool_room
          icon: mdi:snowflake
          variables:
            accent_color: var(--room-bedroom)
            tap_action: toggle
        - type: custom:button-card
          template: heater_room_button
          entity: input_boolean.heat_room
          icon: mdi:radiator
          variables:
            accent_color: var(--room-bedroom)
            tap_action: toggle
styles:
  grid:
    - grid-template-areas: '"n n btn" "l l btn" "i vac btn"'
    - grid-template-columns: 1fr 0.3fr min-content
    - grid-template-rows: min-content min-content 1fr
  custom_fields:
    vac:
      - justify-content: start
      - align-self: start
show_state: true
