# -----------------------------------------------------------
# bedroom.yaml
# Room card — Bedroom tile with temp/humidity label, fan,
# aircon, heater buttons, vacuum alert overlay, and
# animated four-zone electric blanket visualization.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.1
# -----------------------------------------------------------

type: custom:button-card

template: room_card

show_icon: false

variables:
  accent_color: var(--room-bedroom)

name: |
  [[[
    const temp = parseFloat(
      states['sensor.temp_sensor_temperature'].state
    ).toFixed(1);

    const hum = parseFloat(
      states['sensor.temp_sensor_humidity'].state
    ).toFixed(1);

    const air = states['sensor.core_300s_pm2_5'].state;

    let emoji_air = '';

    if (air >= 10) emoji_air = '🤢';
    else if (air <= 2) emoji_air = '🌳';

    let emoji_temp = '';

    if (temp >= 27) emoji_temp = '🔥';
    else if (temp < 17) emoji_temp = '❄️';

    let emoji_hum = '';

    if (hum >= 70) emoji_hum = '💧';

    return `
      <span style="
        display: inline-flex;
        align-items: center;
        font-size: 16px;
      ">
        <span>Bedroom&nbsp;</span>
        <span style="font-size: 9px;">
          ${emoji_temp}${emoji_hum}${emoji_air}
        </span>
      </span>
    `;
  ]]]

tap_action:
  navigation_path: "#room_bedroom"

show_label: true

label: |
  [[[
    const temp = parseFloat(
      states['sensor.temp_sensor_temperature'].state
    ).toFixed(1);

    const hum = parseFloat(
      states['sensor.temp_sensor_humidity'].state
    ).toFixed(1);

    let tempColor = 'inherit';

    if (temp >= 29) tempColor = 'red';
    else if (temp >= 27) tempColor = '#f58f01ff';
    else if (temp < 17) tempColor = '#25a6f1ff';

    let humColor = 'inherit';

    if (hum >= 70) humColor = 'red';

    return `
      <span style="color: ${tempColor}">${temp}°C </span>
      •
      <span style="color: ${humColor}">${hum}%</span>
    `;
  ]]]

custom_fields:

  # =========================================================
  # FOUR-ZONE ELECTRIC BLANKET
  # =========================================================

  i: |
    [[[
      const zones = {
        grahamBody:
          states['select.electric_blanket_graham_body_level'],

        grahamFeet:
          states['select.electric_blanket_graham_feet_level'],

        dawnBody:
          states['select.electric_blanket_dawn_body_level'],

        dawnFeet:
          states['select.electric_blanket_dawn_feet_level']
      };

      const level = entity => {
        const value = parseInt(entity?.state);
        return Number.isFinite(value) ? value : 0;
      };

      /*
       * Generate one heating element.
       *
       * cx / cy = centre of the blanket zone
       * value   = LocalTuya level, 0-6
       */
      const heatZone = (cx, cy, value) => {

        /*
         * OFF
         */
        if (value === 0) {
          return `
            <circle
              cx="${cx}"
              cy="${cy}"
              r="10"
              fill="#ff7043"
              opacity="0.025"
            />
          `;
        }

        const intensity = value / 6;

        const centreOpacity =
          0.18 + intensity * 0.35;

        const ringOpacity =
          0.25 + intensity * 0.45;

        const strokeWidth =
          1.5 + intensity * 2.5;

        /*
         * Higher heat = slightly faster waves.
         */
        const duration =
          (2.8 - intensity * 0.8).toFixed(2);

        /*
         * Second wave is offset by half a cycle.
         */
        const delay =
          (parseFloat(duration) / 2).toFixed(2);

        return `

          <!-- soft heat beneath the element -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="${22 + value * 2}"
            fill="#ff5722"
            opacity="${0.025 + intensity * 0.07}"
          />

          <!-- hot centre -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="${9 + value * 1.2}"
            fill="#ff5722"
            opacity="${centreOpacity}"
          />

          <!-- inner static ring -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="16"
            fill="none"
            stroke="#ff5722"
            stroke-width="${strokeWidth}"
            opacity="${ringOpacity}"
          />

          <!-- middle static ring -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="29"
            fill="none"
            stroke="#ff7043"
            stroke-width="${strokeWidth * 0.8}"
            opacity="${ringOpacity * 0.72}"
          />

          <!-- outer static ring -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="42"
            fill="none"
            stroke="#ff8a65"
            stroke-width="${strokeWidth * 0.6}"
            opacity="${ringOpacity * 0.42}"
          />

          <!-- expanding heat wave -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="13"
            fill="none"
            stroke="#ff5722"
            stroke-width="${strokeWidth}"
            opacity="0"
          >

            <animate
              attributeName="r"
              values="13;23;36;50"
              dur="${duration}s"
              repeatCount="indefinite"
            />

            <animate
              attributeName="opacity"
              values="${0.85 * intensity};
                      ${0.55 * intensity};
                      ${0.22 * intensity};
                      0"
              dur="${duration}s"
              repeatCount="indefinite"
            />

            <animate
              attributeName="stroke-width"
              values="${strokeWidth};
                      ${strokeWidth};
                      ${strokeWidth * 0.7};
                      ${strokeWidth * 0.3}"
              dur="${duration}s"
              repeatCount="indefinite"
            />

          </circle>

          <!-- second expanding wave -->

          <circle
            cx="${cx}"
            cy="${cy}"
            r="13"
            fill="none"
            stroke="#ff7043"
            stroke-width="${strokeWidth * 0.8}"
            opacity="0"
          >

            <animate
              attributeName="r"
              values="13;23;36;50"
              dur="${duration}s"
              begin="${delay}s"
              repeatCount="indefinite"
            />

            <animate
              attributeName="opacity"
              values="${0.65 * intensity};
                      ${0.40 * intensity};
                      ${0.15 * intensity};
                      0"
              dur="${duration}s"
              begin="${delay}s"
              repeatCount="indefinite"
            />

          </circle>
        `;
      };

      const gb = level(zones.grahamBody);
      const gf = level(zones.grahamFeet);
      const db = level(zones.dawnBody);
      const df = level(zones.dawnFeet);

      /*
       * Bedroom identity colour.
       */
      const bedColour =
        variables.accent_color;

      return `
        <svg
          viewBox="0 0 300 210"
          xmlns="http://www.w3.org/2000/svg"
          style="
            width:93px;
            height:65px;
            overflow:visible;
          "
        >

          <!-- background circle -->
          <circle
            cx="140"
            cy="100"
            r="200"
            fill="${bedColour}"
            opacity="0.1"
          />

          <!-- ================================= -->
          <!-- BED FRAME                          -->
          <!-- ================================= -->

          <rect
            x="33"
            y="8"
            width="236"
            height="190"
            rx="15"
            fill="none"
            stroke="${bedColour}"
            stroke-width="15"
            opacity="0.3"
          />

          <!-- subtle mattress surface -->

          <rect
            x="40"
            y="15"
            width="220"
            height="180"
            rx="11"
            fill="${bedColour}"
            opacity="0.025"
          />

          <!-- ================================= -->
          <!-- BEDSHEET                           -->
          <!-- ================================= -->

          <rect
            x="43"
            y="59"
            width="215"
            height="133"
            rx="9"
            fill="${bedColour}"
            opacity="0.15"
          />

          <!-- ================================= -->
          <!-- PILLOWS                            -->
          <!-- ================================= -->

          <rect
            x="43"
            y="19"
            width="105"
            height="36"
            rx="9"
            fill="${bedColour}"
            opacity="0.3"
          />

          <rect
            x="153"
            y="19"
            width="105"
            height="36"
            rx="9"
            fill="${bedColour}"
            opacity="0.3"
          />

          <!-- ================================= -->
          <!-- ZONE DIVIDERS                      -->
          <!-- ================================= -->

          <line
            x1="150"
            y1="55"
            x2="150"
            y2="190"
            stroke="${bedColour}"
            stroke-width="2"
            opacity="0.3"
          />

          <line
            x1="40"
            y1="125"
            x2="260"
            y2="125"
            stroke="${bedColour}"
            stroke-width="2"
            opacity="0.2"
          />

          <!-- ================================= -->
          <!-- HEATING ZONES                      -->
          <!-- ================================= -->

          <!-- Dawn body -->
          ${heatZone(95, 95, db)}

          <!-- Graham body -->
          ${heatZone(205, 95, gb)}

          <!-- Dawn feet -->
          ${heatZone(95, 160, df)}

          <!-- Graham feet -->
          ${heatZone(205, 160, gf)}

        </svg>
      `;
    ]]]

  # =========================================================
  # VACUUM ALERT
  # =========================================================

  vac:
    card:
      type: vertical-stack
      cards:

        - type: conditional
          conditions:
            - condition: and
              conditions:
                - condition: state
                  entity: input_boolean.purifier_vacuum
                  state: "on"

          card:
            type: custom:button-card
            icon: mdi:vacuum
            entity: input_boolean.purifier_vacuum

            tap_action:
              action: navigate
              navigation_path: "#room_bedroom"

            styles:
              card:
                - animation: blink 2s ease infinite
                - height: 30px
                - width: 30px
                - border: none
                - box-shadow: none
                - border-style: none
                - border-radius: 100%
                - margin-right: 5px
                - margin-top: "-54px"

              img_cell:
                - border-radius: 100%
                - background: rgba(180,60,60,1)

              icon:
                - color: white
                - height: 18px
                - width: 18px

            show_name: false

  # =========================================================
  # ROOM CONTROLS
  # =========================================================

  btn:
    card:
      type: vertical-stack
      cards:

        - type: custom:button-card
          template: fan_room_button
          icon: mdi:fan
          entity: switch.plug_blue
          variables:
            accent_color: var(--room-bedroom)
            tap_action: toggle

        - type: custom:button-card
          template: aircon_room_button
          entity: input_boolean.cool_room
          icon: mdi:snowflake
          variables:
            accent_color: var(--room-bedroom)
            tap_action: toggle

        - type: custom:button-card
          template: heater_room_button
          entity: input_boolean.heat_room
          icon: mdi:radiator
          variables:
            accent_color: var(--room-bedroom)
            tap_action: toggle


# ===========================================================
# BEDROOM-SPECIFIC GRID
# ===========================================================

styles:
  grid:
    - grid-template-areas: '"n btn" "l btn" "i btn"'
    - grid-template-columns: 1fr min-content
    - grid-template-rows: min-content min-content 1fr

  card:
    - height: 155px
    - padding: 6px 10px 15px 15px

  custom_fields:
    btn:
      - justify-content: end
      - align-self: start
      - z-index: 2
    i:
      - position: absolute
      - left: 0
      - bottom: 0
      - width: 105px
      - height: 80px
      - margin: 0 0 -5px -5px
      - overflow: visible
      - z-index: 1
    vac:
      - justify-content: start
      - align-self: start
      - z-index: 3

show_state: true