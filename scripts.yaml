# -----------------------------------------------------------
# scripts.yaml
# Home Assistant scripts — Spotify/Spotcast playback helpers.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

Script_spotify:
  alias: activate_chrome_audio
  sequence:
    - service: spotcast.start
      data:
        force_playback: true
        random_song: true
        repeat: "off"
        shuffle: true
        offset: 0
        ignore_fully_played: false
        device_name: f944c8c1faf7cc3350666074b0b53ae8
        country: EN
        account: "{{ states('input_select.spotify_accounts_list')|lower }}"
  mode: single
  icon: mdi:google-chrome

script_tap:
  alias: set_total_duration_then_start_watering
  sequence:
    - service: mqtt.publish
      data:
        topic: /homeassistant/config_from_ha
        payload: '{"tag":"total_duration","id":"DF404121004B1200","value":123}'
    - service: switch.turn_on
      data: {}
      target:
        entity_id: switch.tap_water_switch
  mode: single

speed_test:
  sequence:
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.speedtest_download
          state: unavailable
    - service: homeassistant.reload_config_entry
      data:
        entity_id: sensor.speedtest_download
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
  alias: Speedtest update
  mode: single

dishwasher_start:
  alias: "Dishwasher: Start with selected program and options"
  description: >-
    Reads the input helpers for program and options, sends a single
    home_connect_alt.select_program call, then starts the dishwasher.
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.dishwasher_starting
    - action: home_connect_alt.select_program
      data:
        device_id: cbc483dd378433abf4426eb26e91b4cb
        program_key: "{{ states('input_select.dishwasher_program') }}"
        options:
          - key: "Dishcare.Dishwasher.Option.ExtraDry"
            value: "{{ is_state('input_boolean.dishwasher_option_extradry', 'on') }}"
          - key: "Dishcare.Dishwasher.Option.HygienePlus"
            value: "{{ is_state('input_boolean.dishwasher_option_hygieneplus', 'on') }}"
          - key: "Dishcare.Dishwasher.Option.VarioSpeed"
            value: "{{ is_state('input_boolean.dishwasher_option_variospeed', 'on') }}"
    - action: home_connect_alt.start_program
      data:
        device_id: cbc483dd378433abf4426eb26e91b4cb
        program_key: "{{ states('input_select.dishwasher_program') }}"
  mode: single
