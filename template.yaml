# -----------------------------------------------------------
# template.yaml
# Jinja2 template sensors — media sources, plug power,
# weather, light counts, and battery monitoring.
# Author: Graham Stott (littlestotty-labs)
# Version: 1.0
# -----------------------------------------------------------

- sensor:
    - unique_id: shield_source
      name: Shield TV Source
      default_entity_id: sensor.shield_source
      state: '{{ states.media_player.android_tv_10_0_0_26.attributes["source"] }}'

    - unique_id: tv_source
      name: Living Room TV Source
      default_entity_id: sensor.tv_source
      state: '{{ states.media_player.lg_webos_smart_tv.attributes["source"] }}'

    - unique_id: shield_source
      name: Shield TV Source
      default_entity_id: sensor.shield_source
      state: '{{ states.media_player.android_tv_10_0_0_26.attributes["source"] }}'

    - unique_id: soundbar_volume
      name: Soundbar Volume
      default_entity_id: sensor.soundbar_volume
      state: '{{ states.media_player.soundbar.attributes["volume_level"] }}'

    - unique_id: tv_volume
      name: LG TV Volume
      default_entity_id: sensor.tv_volume
      state: '{{ states.media_player.lg_tv.attributes["volume_level"] }}'

    - unique_id: plug_green_power
      name: Green Plug Power
      default_entity_id: sensor.plug_green_power
      state: "{{ states.sensor.green_plug_power }}"
      unit_of_measurement: W
      device_class: power

    #    - unique_id: plug_pink_2_power
    #      name: pink_2 Plug Power
    #      default_entity_id: sensor.plug_pink_2_power
    #      state: "{{ states.sensor.smart_plug_2_power }}"
    #      unit_of_measurement: W
    #      device_class: power

    - unique_id: plug_yellow_2_power
      name: yellow_2 Plug Power
      default_entity_id: sensor.plug_yellow_2_power
      state: "{{ states.sensor.yellow_2_power }}"
      unit_of_measurement: W
      device_class: power

    - unique_id: plug_peach_2_power
      name: peach_2 Plug Power
      default_entity_id: sensor.plug_peach_2_power
      state: "{{ states.sensor.peach_2_power }}"
      unit_of_measurement: W
      device_class: power

    # - unique_id: plug_purple_2_power
    #   name: purple_2 Plug Power
    #   default_entity_id: sensor.plug_purple_2_power
    #   state: "{{ states.plug_purple_2_power_2}}"
    #   unit_of_measurement: W
    #   device_class: power

    - unique_id: ryde_temperature
      name: Ryde Current Temperature
      default_entity_id: sensor.ryde_temperature
      state: '{{ states.weather.ryde.attributes["temperature"] }}'
      device_class: temperature

    - unique_id: number_of_lights_on
      name: Number of House Lights On
      default_entity_id: sensor.number_of_lights_on
      state: |
        {% set lights = [ states.light.lobby_light,
                          states.light.outside_front,
                          states.light.stairs_light,
                          states.light.office_light, 
                          states.light.laundry_light,
                          states.light.lounge_light,
                          states.light.loo_light ,
                          states.light.upstairs_landing_bedroom ] %}
        {{ lights | selectattr('state', 'eq', 'on') | list | count }}
      unit_of_measurement: "lights on"
      device_class: volume

    - unique_id: low_batteries_count
      name: "Low Batteries Count"
      icon: mdi:battery-alert
      state: >
        {% set threshold = 40 %}
        {% set batteries = states.sensor
          | selectattr('entity_id', 'search', 'battery')
          | rejectattr('state', 'in', ['unavailable', 'unknown'])
          | rejectattr('entity_id', 'search', 'state')
          | rejectattr('entity_id', 'search', '906')
          | rejectattr('entity_id', 'search', '926')
          | map(attribute='state')
          | map('float', 100)
          | select('lt', threshold)
          | list
        %}
        {{ batteries | count }}

    - unique_id: next_bins_type
      name: Next Bins Type
      state: >
        {% if states('sensor.waste_collection_schedule_recycling') == states('sensor.waste_collection_schedule_general_waste') %}
          recycling
        {% elif states('sensor.waste_collection_schedule_garden_organics') == states('sensor.waste_collection_schedule_general_waste') %}
          organics
        {% else %}
          none
        {% endif %}

    - unique_id: dishwasher_program_name
      name: Dishwasher Program Name
      icon: mdi:dishwasher
      state: >
        {% set programs = {
          'Dishcare.Dishwasher.Program.Normal45': 'Eco Wash',
          'Dishcare.Dishwasher.Program.Auto2': 'Auto Wash',
          'Dishcare.Dishwasher.Program.Auto1': 'Auto Gentle',
          'Dishcare.Dishwasher.Program.Quick65': 'Quick 1h',
          'Dishcare.Dishwasher.Program.Quick45': 'Express Wash',
          'Dishcare.Dishwasher.Program.NightWash': 'Extra Quiet',
          'Dishcare.Dishwasher.Program.MachineCare': 'Machine Care',
          'Dishcare.Dishwasher.Program.Intensiv70': 'Pots / Pans',
          'Dishcare.Dishwasher.Program.PreRinse': 'Pre-rinse',
          'Dishcare.Dishwasher.Program.Kurz60': 'Short 60°C'
        } %}
        {{ programs.get(states('select.012030522493002223_programs'), 'Unknown') }}

    - unique_id: dishwasher_program_description
      name: Dishwasher Program Description
      icon: mdi:text-box-outline
      state: >
        {% set programs = {
          'Dishcare.Dishwasher.Program.Normal45': 'Mixed tableware & cutlery',
          'Dishcare.Dishwasher.Program.Auto2': 'Mixed tableware & cutlery',
          'Dishcare.Dishwasher.Program.Auto1': 'Delicate items, plastics, glasses',
          'Dishcare.Dishwasher.Program.Quick65': 'Mixed tableware & cutlery',
          'Dishcare.Dishwasher.Program.Quick45': 'Delicate items, plastics, glasses',
          'Dishcare.Dishwasher.Program.NightWash': 'Mixed tableware & cutlery',
          'Dishcare.Dishwasher.Program.MachineCare': 'Maintenance cycle only',
          'Dishcare.Dishwasher.Program.Intensiv70': 'Pots, pans, non-fragile tableware',
          'Dishcare.Dishwasher.Program.PreRinse': 'Cold water rinse without detergent',
          'Dishcare.Dishwasher.Program.Kurz60': 'Optimised for normal dishes'
        } %}
        {{ programs.get(states('select.012030522493002223_programs'), '') }}

    - unique_id: dishwasher_program_icon
      name: Dishwasher Program Icon
      state: >
        {% set icons = {
          'Dishcare.Dishwasher.Program.Normal45': 'mdi:leaf',
          'Dishcare.Dishwasher.Program.Auto2': 'mdi:auto-fix',
          'Dishcare.Dishwasher.Program.Auto1': 'mdi:glass-fragile',
          'Dishcare.Dishwasher.Program.Quick65': 'mdi:timer-outline',
          'Dishcare.Dishwasher.Program.Quick45': 'mdi:flash',
          'Dishcare.Dishwasher.Program.NightWash': 'mdi:volume-off',
          'Dishcare.Dishwasher.Program.MachineCare': 'mdi:wrench',
          'Dishcare.Dishwasher.Program.Intensiv70': 'mdi:pot',
          'Dishcare.Dishwasher.Program.PreRinse': 'mdi:water',
          'Dishcare.Dishwasher.Program.Kurz60': 'mdi:clock-fast'
        } %}
        {{ icons.get(states('select.012030522493002223_programs'), 'mdi:dishwasher') }}

    # Dishwasher local-helpers sync — mirrors actual state to helpers
    - unique_id: dishwasher_synced_program
      name: "Dishwasher Synced Program"
      state: >
        {{ states('select.012030522493002223_programs') }}

    - unique_id: dishwasher_synced_extradry
      name: "Dishwasher Synced Extra Dry"
      state: >
        {{ states('switch.012030522493002223_dishcare_dishwasher_option_extradry') }}

    - unique_id: dishwasher_synced_hygieneplus
      name: "Dishwasher Synced HygienePlus"
      state: >
        {{ states('switch.012030522493002223_dishcare_dishwasher_option_hygieneplus') }}

    - unique_id: dishwasher_synced_variospeed
      name: "Dishwasher Synced SpeedPerfect"
      state: >
        {{ states('binary_sensor.012030522493002223_dishcare_dishwasher_option_variospeed') }}

    - unique_id: dishwasher_quiet_now
      name: Dishwasher Quiet Now
      icon: mdi:volume-off
      state: >
        {% set state = states('switch.012030522493002223_dishcare_dishwasher_option_silenceondemand') %}
        {% if state == 'on' %}
          On
        {% elif state == 'off' %}
          Off
        {% else %}
          Unavailable
        {% endif %}

    - unique_id: dishwasher_start_time
      name: Dishwasher Start Time
      icon: mdi:clock-start
      state: >
        {{ states('sensor.012030522493002223_bsh_common_option_startinrelative') }}

    - unique_id: dishwasher_status
      name: Dishwasher Status
      icon: mdi:dishwasher
      state: >
        {% set power = states('switch.012030522493002223_bsh_common_setting_powerstate') %}
        {% set opState = states('sensor.012030522493002223_bsh_common_status_operationstate') %}
        {% if power == 'on' %}
          {% if opState and 'Run' in opState %}
            running
          {% else %}
            idle
          {% endif %}
        {% else %}
          off
        {% endif %}

- binary_sensor:
    - unique_id: landing_motion_combined
      name: "Landing Motion Combined"
      device_class: motion
      state: >
        {{ is_state('binary_sensor.upstairs_sensor_occupancy', 'on')
           or is_state('binary_sensor.0xa4c13878fe0e5f3e_occupancy', 'on') }}
